[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = []
# Serde and OpenTelemetry use syn 3 while Tokio and URL's ICU dependencies use syn 2.
# Keep this exact exception until the dependency graph converges.
skip = [
  { crate = "syn@2" },
  { crate = "syn@3" },
  # OpenTelemetry uses rand with getrandom 0.3 while Rustls build tooling uses 0.4.
  { crate = "getrandom@0.3" },
  { crate = "getrandom@0.4" },
]
skip-tree = []

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
]
exceptions = []

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
