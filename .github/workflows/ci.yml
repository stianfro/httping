name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Just gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: rustup show active-toolchain
      - name: Cache Cargo files
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: Install tools
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e
        with:
          tool: cargo-deny@0.20.2,cargo-dist@0.32.0,just@1.55.1
      - name: Install yq
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/mikefarah/yq/releases/download/v4.47.2/yq_linux_amd64 \
            -o /tmp/yq
          echo "1bb99e1019e23de33c7e6afc23e93dad72aad6cf2cb03c797f068ea79814ddb0  /tmp/yq" \
            | sha256sum --check
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
      - name: Run gates
        run: just ci
